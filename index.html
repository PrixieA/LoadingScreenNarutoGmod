<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>SCR — Chargement</title>
  <meta name="description" content="Écran de chargement de Shinobi Chronicle RP.">
  <link rel="stylesheet" href="style.css?v=2">
  <script src="config.js" defer></script>
  <script src="script.js" defer></script>
</head>
<body>
  <main aria-label="Écran de chargement de Shinobi Chronicle RP">
    <div class="slideshow" aria-hidden="true"><div class="slide"></div><div class="slide"></div></div>
    <div class="shade" aria-hidden="true"></div>
    <div class="volume-panel" role="group" aria-label="Volume de la musique">
      <button id="mute" type="button" aria-label="Activer la musique" aria-pressed="true" title="Activer la musique">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 4 6 8H3v8h3l5 4Z"/><g id="sound-off"><path d="m16 9 6 6m0-6-6 6"/></g><g id="sound-on" hidden><path d="M15 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/></g></svg>
      </button>
      <div class="volume-setting"><label for="volume">MUSIQUE</label><input id="volume" type="range" min="0" max="100" step="1" value="0" aria-label="Volume de la musique"></div>
      <output id="volume-value" for="volume">0 %</output>
      <span id="audio-status" role="status"></span>
    </div>
  </main>
  <audio id="music" preload="none" muted></audio>
</body>
</html>
